<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      try {
        var p = localStorage.getItem('theme') || 'auto';
        var dark = p === 'dark' || (p === 'auto' &&
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var r = document.documentElement;
        r.setAttribute('data-theme', dark ? 'dark' : 'light');
        r.setAttribute('data-theme-pref', p);
      } catch (e) {}
    })();
  </script>
  <title>{{copy.meta.title}}</title>
  <meta name="description" content="{{copy.meta.description}}">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="{{themeColor}}">
  <link rel="canonical" href="{{url}}/">
  <meta property="og:title" content="{{copy.meta.title}}">
  <meta property="og:description" content="{{copy.meta.socialDescription}}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{url}}/">
  <meta property="og:locale" content="{{locale}}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{copy.meta.title}}">
  <meta name="twitter:description" content="{{copy.meta.socialDescription}}">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.svg" sizes="180x180">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="mask-icon" href="/mask-icon.svg" color="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "{{name}}",
    "jobTitle": "{{title}}",
    "url": "{{url}}",
    "sameAs": [
      "{{contact.github}}",
      "{{contact.linkedin}}"
    ]
  }
  </script>
  <!-- google adsense: site verification + ad library (covers the blog subdomain) -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9199227429999584" crossorigin="anonymous"></script>
</head>
<body>
  <div id="app"></div>
  <noscript>
    <p>{{copy.meta.noscript}}</p>
  </noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
